[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "subject-recolor"
version = "0.1.0"
description = "A safe, resumable batch pipeline for recoloring user-selected image subjects from color cards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "joewhoa" }]
keywords = ["image-editing", "batch-processing", "generative-ai", "color"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
]

[project.urls]
Homepage = "https://github.com/Joewhoa/subject-recolor"
Repository = "https://github.com/Joewhoa/subject-recolor"
Issues = "https://github.com/Joewhoa/subject-recolor/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
subject-recolor = "subject_recolor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subject_recolor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["新方案交接落地"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
